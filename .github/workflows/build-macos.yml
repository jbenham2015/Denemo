name: Build Denemo for macOS (Apple Silicon)
on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14   # Apple Silicon (arm64)
    env:
      # Keg-only packages print advisory hints that can make brew exit non-zero in CI
      HOMEBREW_NO_ENV_HINTS: "1"
      HOMEBREW_NO_PATH_SHADOW_CHECK: "1"
      HOMEBREW_NO_AUTO_UPDATE: "1"

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # ── Dependencies ─────────────────────────────────────────────────────────
    - name: Install build dependencies
      run: |
        brew install \
          autoconf \
          automake \
          libtool \
          intltool \
          pkg-config \
          gtk+3 \
          gtksourceview3 \
          libassuan \
          libgpg-error \
          librsvg \
          gtk-doc \
          expat \
          guile \
          aubio \
          perl-xml-parser \
          portaudio \
          portmidi \
          fftw \
          libxml2 \
          fluid-synth \
          rubberband \
          libsndfile \
          jpeg-turbo \
          openjpeg \
          little-cms2 \
          freetype \
          fontconfig \
          cairo \
          poppler \
          nss \
          nspr \
          gpgme \
          gpgmepp \
          gettext \
          evince \
          xz \
          zstd \
          dylibbundler \
          create-dmg

    - name: Verify key dependencies are installed
      run: |
        for pkg in portmidi portaudio fftw librsvg fluid-synth gtk+3 guile; do
          brew --prefix "$pkg" >/dev/null 2>&1 || { echo "::error::$pkg is not installed"; exit 1; }
        done

    - name: Ensure XML::Parser is available for intltool
      run: |
        if ! /opt/homebrew/bin/perl -MXML::Parser -e 1 2>/dev/null; then
          echo "XML::Parser not found, installing via cpan..."
          echo | /opt/homebrew/bin/cpan XML::Parser
        else
          echo "XML::Parser OK"
        fi

    # ── Build ────────────────────────────────────────────────────────────────
    - name: Run autotools
      run: |
        export PATH="/opt/homebrew/bin:/opt/homebrew/sbin:$PATH"
        chmod +x autogen.sh
        ./autogen.sh

    - name: Configure
      run: |
        export PATH="/opt/homebrew/bin:/opt/homebrew/sbin:$PATH"
        # Keep this on one line: spaces after a line continuation would end up in the value
        export PKG_CONFIG_PATH="/opt/homebrew/opt/expat/lib/pkgconfig:/opt/homebrew/opt/libxml2/lib/pkgconfig:/opt/homebrew/opt/portmidi/lib/pkgconfig:/opt/homebrew/lib/pkgconfig:/opt/homebrew/share/pkgconfig"
        mkdir -p _build_arm64
        cd _build_arm64
        ../configure --prefix=/opt/homebrew \
          --enable-debug \
          --enable-portmidi \
          --disable-jack \
          --disable-atril \
          --enable-evince \
          CFLAGS="-arch arm64 -D_MACH_O_" \
          CXXFLAGS="-arch arm64" \
          LDFLAGS="-arch arm64 -L/opt/homebrew/opt/expat/lib -L/opt/homebrew/opt/libxml2/lib -L/opt/homebrew/opt/portmidi/lib" \
          CPPFLAGS="-I/opt/homebrew/opt/expat/include -I/opt/homebrew/opt/libxml2/include -I/opt/homebrew/opt/portmidi/include" \
        || (echo "==== config.log tail ====" && tail -n 150 config.log && exit 1)

    - name: Make
      run: |
        export PATH="/opt/homebrew/bin:/opt/homebrew/sbin:$PATH"
        cd _build_arm64
        make -j"$(sysctl -n hw.logicalcpu)"

    - name: Make install
      run: |
        export PATH="/opt/homebrew/bin:/opt/homebrew/sbin:$PATH"
        cd _build_arm64
        make install

    # ── Inspect the plain install ────────────────────────────────────────────
    - name: Inspect installed files
      run: |
        echo "=== Binary arch ===" && lipo -info /opt/homebrew/bin/denemo
        echo "=== Share ===" && find /opt/homebrew/share/denemo -maxdepth 2 2>/dev/null || echo "No share/denemo"
        echo "=== Dylib dependencies ===" && otool -L /opt/homebrew/bin/denemo

    - name: Smoke test installed binary
      run: |
        /opt/homebrew/bin/denemo --version 2>&1 || true
        /opt/homebrew/bin/denemo --help 2>&1 | head -5 || true

    # ── Bundle and DMG ───────────────────────────────────────────────────────
    - name: Bundle app and create DMG
      run: |
        export PATH="/opt/homebrew/bin:/opt/homebrew/sbin:$PATH"
        export HOMEBREW_PREFIX="/opt/homebrew"
        chmod +x packaging/bundle-macos.sh
        ./packaging/bundle-macos.sh

    # ── Test the DMG that users will actually get ────────────────────────────
    - name: Smoke test DMG contents
      run: |
        set -uo pipefail

        DMG=$(ls Denemo-*-macOS.dmg Denemo.dmg 2>/dev/null | head -n 1 || true)
        if [ -z "$DMG" ]; then
          echo "::error::No DMG found"
          exit 1
        fi
        echo "Testing $DMG"

        MNT=$(mktemp -d)
        hdiutil attach "$DMG" -nobrowse -readonly -mountpoint "$MNT"
        trap 'hdiutil detach "$MNT" -force >/dev/null 2>&1 || true' EXIT

        APP=$(find "$MNT" -maxdepth 2 -name "*.app" | head -n 1)
        if [ -z "$APP" ]; then
          echo "::error::No .app bundle in DMG"
          find "$MNT" -maxdepth 3
          exit 1
        fi
        echo "Found app: $APP"

        # Copy out so we run it like a user would, not from the read-only image
        WORK=$(mktemp -d)
        cp -R "$APP" "$WORK/"
        APP="$WORK/$(basename "$APP")"

        # 1. Every Mach-O file must be arm64 and must not reference Homebrew paths
        FAIL=0
        while IFS= read -r f; do
          if file "$f" | grep -q "Mach-O"; then
            if ! lipo -archs "$f" 2>/dev/null | grep -qw arm64; then
              echo "::error::Not arm64: $f"
              FAIL=1
            fi
            BAD=$(otool -L "$f" 2>/dev/null | tail -n +2 | awk '{print $1}' \
                  | grep -E '^(/opt/homebrew|/usr/local)' || true)
            if [ -n "$BAD" ]; then
              echo "::error::External library path in $f:"
              echo "$BAD"
              FAIL=1
            fi
          fi
        done < <(find "$APP" -type f)

        if [ "$FAIL" -ne 0 ]; then
          echo "::error::Bundle has non-relocatable or wrong-arch binaries"
          exit 1
        fi
        echo "All Mach-O files are arm64 and relocatable"

        # 2. Run the bundled binary with Homebrew hidden from the library search
        BIN=$(find "$APP/Contents/MacOS" -type f -perm -u+x | head -n 1)
        echo "Bundled binary: $BIN"
        env -i HOME="$HOME" PATH="/usr/bin:/bin" "$BIN" --version 2>&1 | head -5

        # 3. Startup test: launch and check it doesn't crash within 10 seconds.
        #    No display on the runner, so a clean "cannot open display" exit is acceptable;
        #    a dyld/library error is not.
        env -i HOME="$HOME" PATH="/usr/bin:/bin" "$BIN" > startup.log 2>&1 &
        PID=$!
        sleep 10
        kill "$PID" 2>/dev/null || true
        echo "---- startup log ----"
        cat startup.log
        if grep -Eqi "dyld|Library not loaded|image not found|symbol not found" startup.log; then
          echo "::error::dynamic linker error during startup"
          exit 1
        fi

    # ── Upload artifact ──────────────────────────────────────────────────────
    - name: Upload DMG Artifact
      uses: actions/upload-artifact@v4
      with:
        name: denemo-macos-arm64-dmg
        path: |
          Denemo-*-macOS.dmg
          Denemo.dmg
        if-no-files-found: error
